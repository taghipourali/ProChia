# ProChia production stack: Postgres, the API (with its scheduler) and nginx serving the member site,
# the API, and the Windows app download for staff.
#
# From a release bundle, which needs no foreign internet on the server: ./install.sh
# From source, building the images on the server (see docker-compose.build.yml):
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.build.yml \
#     --env-file infra/.env up -d --build

services:
  db:
    image: ${IMAGE_REGISTRY:-docker.io}/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prochia
      POSTGRES_USER: prochia
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prochia']
      interval: 5s
      retries: 10

  api:
    image: prochia/api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://prochia:${DB_PASSWORD}@db:5432/prochia
      ROOT_DOMAIN: ${ROOT_DOMAIN:?set ROOT_DOMAIN}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: https://panel.${ROOT_DOMAIN}
      SMS_PROVIDER: ${SMS_PROVIDER:-kavenegar}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      KAVENEGAR_OTP_TEMPLATE: ${KAVENEGAR_OTP_TEMPLATE:-}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-zarinpal}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-false}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  web:
    image: prochia/web:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
    ports:
      - '80:80'
    volumes:
      - uploads:/srv/uploads:ro
      # The Windows installer staff download from panel.<domain> (put there by install.sh).
      - ./downloads:/srv/downloads:ro

volumes:
  pgdata:
  uploads:
