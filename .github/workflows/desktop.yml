name: Windows app

# Builds the ProChia panel installer. It carries the WebView2 runtime, so restaurant and café PCs
# install it without reaching Microsoft. Run it from the Actions tab or push a tag like
# desktop-v0.1.0; the release workflow also calls it to put the installer in the server bundle.
on:
  workflow_dispatch:
  workflow_call:
  push:
    tags: ['desktop-v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prochia/desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: prochia-panel-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
