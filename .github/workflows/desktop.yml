name: Windows app

# Builds the ProChia panel installer (.exe and .msi). Run it from the Actions tab, or push a
# tag like desktop-v0.1.0; the installers are attached to the run as an artifact.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prochia/desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: prochia-panel-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
